<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hyperframes Genie</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #12141a;
        font-family: Inter, sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12.0"
      data-width="1920"
      data-height="1080"
    >
      <div
  id="open"
  data-composition-id="open"
  data-composition-src="compositions/open.html"
  data-start="0.0"
  data-duration="4.0"
  data-track-index="1"
  data-track-kind="graphics"
  data-width="1920"
  data-height="1080"
  data-variable-values="{&quot;eyebrow&quot;:&quot;BAML&quot;,&quot;headline&quot;:&quot;Plan the film in types&quot;,&quot;body&quot;:&quot;A model returns scenes, copy, and color. Nothing else.&quot;,&quot;ground&quot;:&quot;#12141a&quot;,&quot;ink&quot;:&quot;#f4f1ea&quot;,&quot;accent&quot;:&quot;#d6ff4a&quot;}"
></div><div
  id="make"
  data-composition-id="make"
  data-composition-src="compositions/make.html"
  data-start="4.0"
  data-duration="4.0"
  data-track-index="1"
  data-track-kind="graphics"
  data-width="1920"
  data-height="1080"
  data-variable-values="{&quot;eyebrow&quot;:&quot;Hyperframes&quot;,&quot;headline&quot;:&quot;HTML is the timeline&quot;,&quot;body&quot;:&quot;Each scene is a paused composition the renderer can seek.&quot;,&quot;ground&quot;:&quot;#12141a&quot;,&quot;ink&quot;:&quot;#f4f1ea&quot;,&quot;accent&quot;:&quot;#d6ff4a&quot;}"
></div><div
  id="render"
  data-composition-id="render"
  data-composition-src="compositions/render.html"
  data-start="8.0"
  data-duration="4.0"
  data-track-index="1"
  data-track-kind="graphics"
  data-width="1920"
  data-height="1080"
  data-variable-values="{&quot;eyebrow&quot;:&quot;Genie&quot;,&quot;headline&quot;:&quot;Then it becomes video&quot;,&quot;body&quot;:&quot;Check the composition, preview it, and render the mp4.&quot;,&quot;ground&quot;:&quot;#12141a&quot;,&quot;ink&quot;:&quot;#f4f1ea&quot;,&quot;accent&quot;:&quot;#d6ff4a&quot;}"
></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
